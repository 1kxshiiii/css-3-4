<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Web Project</title>
    <style>
        .skip-link {
            position: absolute;
            left: -10000px;
            top: auto;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
        .skip-link:focus {
            position: static;
            width: auto;
            height: auto;
            display: inline-block;
            background-color: #ffcc00;
            color: #000;
            padding: 10px;
            font-weight: bold;
            text-decoration: none;
        }

        nav {
            display: flex;
            justify-content: space-around;
            background-color: #333;
            padding: 15px;
            border-radius: 8px;
        }
        nav a {
            color: white;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        nav a:hover {
            color: #ffcc00;
            transform: scale(1.1);
        }

        /* --- 5. BASE IMAGE BOX MODEL --- */
        .gallery-container img {
            border: 4px solid #444;
            padding: 8px;
            box-sizing: border-box;
            width: 100%;
            height: auto;
        }

        /* --- 9. NTH-CHILD SELECTOR --- */
        /* Alternates border-radius structures for every second image */
        .gallery-container img:nth-child(even) {
            border-radius: 50px;
            border-color: #007BFF;
        }
        .gallery-container img:nth-child(odd) {
            border-radius: 4px;
            border-color: #28A745;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
</head>
<body>

    <a href="#main-content" class="skip-link">Skip to Main Content</a>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main id="main-content">
        <h1>Image Gallery</h1>
        <p>This page features 5 images styled using an alternating <code>:nth-child</code> structure to display distinct border-radii and border colors.</p>
        
        <div class="gallery-container">
            <img src="https://unsplash.com" alt="Foggy mountain forest">
            <img src="https://unsplash.com" alt="Green field pasture">
            <img src="https://unsplash.com" alt="Wooden pathway through forest">
            <img src="https://unsplash.com" alt="Sunlight streaming through trees">
            <img src="https://unsplash.com" alt="Close up photo of green leaves">
        </div>
    </main>

</body>
</html>
